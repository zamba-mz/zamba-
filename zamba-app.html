async function liveStartHost(){
 const title=(($l("liveTitle")?.value)||"").trim(),cat=$l("liveCategory")?.value||"";
 if(!title){liveToast("Escreve um título para a Live.");return}
 const go=$l("liveGo");if(go)go.disabled=true;
 let st="1/4 carregar LiveKit";liveErr("");
 try{
  liveStatus("A ligar…");
  await loadLK();const L=window.LivekitClient;
  st="2/4 pedir acesso ao servidor (função smooth-responder)";
  const{token,url}=await liveToken("zamba-"+me.id,true,{title,name:prof?.name||"Utilizador",category:cat,avatar:prof?.avatar_url||""});
  st="3/4 ligar ao LiveKit";
  if(liveMedia){liveMedia.getTracks().forEach(t=>t.stop());liveMedia=null}
  const room=new L.Room({adaptiveStream:true,dynacast:true});
  liveBind(room,L,me.id);
  await room.connect(url,token);
  liveRoom=room;liveHostId=me.id;liveRoster={};liveNames=[];liveStatsReset();clearInterval(liveStatsTick);liveStatsTick=setInterval(liveStatsPush,4000);
  st="4/4 abrir câmara e microfone";
  await room.localParticipant.setCameraEnabled(true,{facingMode:liveFacing});
  await room.localParticipant.setMicrophoneEnabled(true);
  const pub=room.localParticipant.getTrackPublication(L.Track.Source.Camera);
  const v=$l("livePreview");if(pub?.track&&v)pub.track.attach(v);
  await ensureDir();
  if(liveDir)await liveDir.track({host:me.id,name:prof?.name||"Utilizador",title,category:cat,avatar:prof?.avatar_url||"",at:new Date().toISOString()});
  const su=$l("liveSetup");if(su)su.remove();
  const h=$l("liveHeadT");if(h)h.textContent=title;
  const tg=$l("liveTag");if(tg)tg.style.display="inline-block";
  liveErr("");liveStatus("● Estás ao vivo");liveSetCount();
  liveChatLine("","Estás ao vivo. Os espectadores vão aparecer aqui.","j");
 }catch(err){
  if(liveRoom){try{await liveRoom.disconnect()}catch(e){}liveRoom=null}
  const raw=String(err?.message||err);let dica="";
  if(st.startsWith("1"))dica="Sem internet ou o carregamento do LiveKit foi bloqueado.";
  else if(st.startsWith("2"))dica=/Edge Function|Failed to send|fetch/i.test(raw)?"A função smooth-responder não respondeu. Confirma no Supabase que está publicada e tem os 3 segredos.":"";
  else if(st.startsWith("3"))dica="O segredo LIVEKIT_URL deve começar por wss:// e ser o endereço do teu projeto LiveKit.";
  else if(st.startsWith("4"))dica="Permite a câmara e o microfone: toca no cadeado ao lado do endereço do site.";
  liveStatus("");liveErr("Falhou no passo "+st+".\nErro: "+raw+(dica?"\n"+dica:""));
  if(go)go.disabled=false;livePreviewStart();
 }}

 if(a==="accept"){const id=lv.dataset.id;try{await liveStageCall("promote",id);liveStage.add(id);delete liveAsks[id];liveBadge();liveToast("Convidado para o palco.")}catch(e){liveToast("Palco: "+(e.message||e))}liveSheet(livePeopleHtml());return}
 if(a==="deny"){delete liveAsks[lv.dataset.id];liveBadge();liveSheet(livePeopleHtml());return}
 if(a==="kick"){const id=lv.dataset.id;try{await liveStageCall("demote",id);liveStage.delete(id);document.querySelector(`#liveGuests [data-gid="${id}"]`)?.remove();if(liveBattle&&liveBattle.guest===id)liveBattleEnd()}catch(e){liveToast("Palco: "+(e.message||e))}liveSheet(livePeopleHtml());return}
 if(a==="stageon"){await liveStageOn();return}
 if(a==="battle"){liveSheet(liveBattleSheet());return}
 if(a==="battlego"){liveBattleStart(Number(lv.dataset.m)||3);return}
 if(a==="battleend"){liveBattleEnd();return}
 if(a==="side"){liveGiftSide=lv.dataset.s==="g"?"g":"h";liveSheet(liveGiftsHtml());return}
 if(a==="sheetx"){liveSheet("");return}
 if(a==="send"){
  const inp=$l("liveChatInput"),body=(inp?.value||"").trim();if(!body)return;
  if(!liveRoom){liveToast("O chat só funciona com a Live ligada.");return}
  if(liveMutedSet.has(me?.id)){liveToast("O anfitrião silenciou-te.");return}
  const name=prof?.name||"Utilizador";
  if(await liveSend({t:"chat",name,body,av:prof?.avatar_url||""}))liveChatLine(name,body,"",null,prof?.avatar_url||"");else liveToast("Não foi possível enviar a mensagem.");
  if(inp)inp.value="";return}
 if(a==="schedule"){liveToast("O agendamento persistente ainda precisa de tabela e notificações no Supabase.");return}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target?.id==="liveChatInput")document.querySelector('[data-lv="send"]')?.click()});

function tnRoundName(size,round){const last=Math.log2(size);return round===last?"Final":round===last-1?"Semifinal":"Ronda "+round}
function tnInner(){
 const d=tnData,head=isAdm?`<button data-lv="tncreate" style="width:100%;margin-bottom:10px">＋ Criar torneio</button>`:"";
 if(!d)return head+`<div class="mu">A carregar…</div>`;
 if(d.error)return head+`<div class="mu">${esc(d.error)}</div>`;
 if(!d.list.length)return head+`<div class="mu">Ainda não há torneios. Os torneios oficiais da ZAMBA aparecem aqui.</div>`;
 const nm=id=>esc(d.names[id]||"—");
 return head+d.list.map(t=>{
  const ent=d.E.filter(x=>x.tournament_id===t.id),joined=ent.some(x=>x.user_id===me.id),ms=d.M.filter(x=>x.tournament_id===t.id);
  const st=t.status==="open"?"Inscrições abertas":t.status==="running"?"Em curso":"Terminado",canMng=isAdm||t.created_by===me.id;
  let body="";
  if(t.status==="open"){
   body=`<div class="mu">${ent.length}/${t.size} inscritos${ent.length?": "+ent.map(x=>nm(x.user_id)).join(", "):""}</div><div class="row" style="margin-top:8px;justify-content:flex-start;gap:8px">${joined?`<button class="g" data-lv="tnleave" data-id="${t.id}">Sair</button>`:`<button data-lv="tnjoin" data-id="${t.id}"${ent.length>=t.size?" disabled":""}>Inscrever-me</button>`}${canMng&&ent.length===t.size?`<button data-lv="tnstart" data-id="${t.id}">▶ Iniciar torneio</button>`:""}</div>`
  }else{
   body=ms.map(m=>{
    const mine=m.a_id===me.id&&m.status==="pending"&&m.b_id;
    const line=(m.a_id||m.b_id)?`${nm(m.a_id)} <span class="mu">vs</span> ${nm(m.b_id)}`:`<span class="mu">A definir</span>`;
    const res=m.status==="done"?` — 🏆 ${nm(m.winner_id)} <span class="mu">(${m.a_score}–${m.b_score})</span>`:m.status==="live"?` — <b style="color:#e5485d">● a decorrer</b>`:"";
    return`<div style="padding:8px 0;border-top:1px solid var(--ln)"><div class="mu" style="font-size:12px">${tnRoundName(t.size,m.round)} · jogo ${m.slot}</div><div>${line}${res}</div>${mine?`<button data-lv="tnmatch" data-id="${m.id}" style="margin-top:6px">⚔ Iniciar a minha batalha</button>`:""}${m.b_id===me.id&&m.status==="pending"&&m.a_id?`<div class="mu" style="margin-top:6px">Aguarda: ${nm(m.a_id)} vai fazer Live e convidar-te para o palco.</div>`:""}${m.status==="live"&&canMng?`<button class="g" data-lv="tnreset" data-id="${m.id}" style="margin-top:6px">↺ Repor jogo</button>`:""}</div>`}).join("")+(t.champion_id?`<div style="margin-top:10px;font-weight:800">🏆 Campeão: ${nm(t.champion_id)}</div>`:"")}
  return`<div style="background:var(--p2);border-radius:14px;padding:12px;margin-bottom:10px"><div class="row"><b>${esc(t.title)}</b><span class="mu" style="font-size:12px">${st}</span></div><div class="mu" style="font-size:12px;margin:2px 0 8px">${t.size} criadores · batalhas de ${t.battle_minutes} min</div>${body}</div>`}).join("")}
async function loadTournaments(force){
 if(!me)return;if(!force&&Date.now()-tnAt<6000)return;tnAt=Date.now();
 try{
  const t=await sb.from("tournaments").select("*").order("created_at",{ascending:false}).limit(8);
  if(t.error)throw new Error(/relation|schema cache|does not exist/i.test(t.error.message)?"Falta instalar os torneios no Supabase.":t.error.message);
  const ids=(t.data||[]).map(x=>x.id);let E=[],M=[];
  if(ids.length){const[e,m]=await Promise.all([sb.from("tournament_entries").select("tournament_id,user_id").in("tournament_id",ids),sb.from("tournament_matches").select("*").in("tournament_id",ids).order("round").order("slot")]);E=e.data||[];M=m.data||[]}
  const uids=[...new Set([...E.map(x=>x.user_id),...M.flatMap(x=>[x.a_id,x.b_id,x.winner_id]),...(t.data||[]).map(x=>x.champion_id)].filter(Boolean))];
  const names={};if(uids.length){const p=await sb.from("profiles").select("id,name").in("id",uids);(p.data||[]).forEach(x=>names[x.id]=x.name)}
  tnData={list:t.data||[],E,M,names};
 }catch(e){tnData={error:String(e.message||e)}}
 const el=document.getElementById("liveTourn");if(el)el.innerHTML=tnInner()}
async function tnOpenMatch(id){
 const d=tnData,m=d?.M?.find(x=>x.id===id);if(!m)return;
 const t=d.list.find(x=>x.id===m.tournament_id);if(!t)return;
 await openLiveStudio();
 liveMatch={id,tid:t.id,title:t.title,minutes:t.battle_minutes,bId:m.b_id,bName:d.names[m.b_id]||"Adversário",round:tnRoundName(t.size,m.round)};
 const ti=$l("liveTitle");if(ti)ti.value="Torneio "+t.title+" · "+liveMatch.round;
 const c=$l("liveCategory");if(c)c.value="Entretenimento";
 liveSheet(`<div class="row"><b>⚔ ${esc(liveMatch.round)} do torneio</b><button class="g" data-lv="sheetx">✕</button></div><p class="mu">Adversário: <b>${esc(liveMatch.bName)}</b>.<br>1) Toca em Ir para o ar.<br>2) Convida ${esc(liveMatch.bName)} (botão Convidar). Ele entra na tua Live e toca em Participar.<br>3) Aceita em Pessoas e toca em Batalha para começar (${liveMatch.minutes} min).</p>`)}
async function liveMatchFinish(){
