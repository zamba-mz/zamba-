<!doctype html>
<html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0a1a">
<title>ZAMBA — Aprende. Cria. Vende. Cresce.</title>
<style>
:root{--bg:#0e0a1a;--p:#1a1430;--p2:#251c42;--ln:#3a2e5c;--tx:#f7f3ff;--mu:#b9acd6;--a:#ff7a59;--b:#7c5cff;--c:#2fd4c0;--ok:#6ee7a8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#2d1d55,transparent 45%),var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:12px;padding:10px 14px;font-weight:700;background:linear-gradient(110deg,var(--b),var(--a));color:#fff}button.g{background:var(--p2);border:1px solid var(--ln)}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--ln);background:var(--p);margin-top:4px}label{font-size:13px;color:var(--mu);display:block;margin-top:10px}
.w{max-width:1000px;margin:auto;padding:14px 14px 90px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.mu{color:var(--mu);font-size:12px}
.logo{font-size:28px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,var(--a),var(--b),var(--c));-webkit-background-clip:text;color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}.card{background:var(--p);border:1px solid var(--ln);border-radius:18px;overflow:hidden;box-shadow:0 8px 24px #0006}
.cv{aspect-ratio:3/4;background:var(--p2) center/cover;cursor:pointer;display:grid;place-items:end start;color:#fff}.cv b{padding:30px 12px 10px;width:100%;background:linear-gradient(transparent,#000c)}
.bd{padding:12px;display:grid;gap:6px}.pr{font-weight:900;color:var(--ok)}.box{background:var(--p);border:1px solid var(--ln);border-radius:16px;padding:16px;margin:12px 0}
.empty{padding:28px;text-align:center;color:var(--mu);border:1px dashed var(--ln);border-radius:16px}.note{background:var(--p2);border-left:4px solid var(--a);padding:10px 12px;border-radius:8px;font-size:13px;color:var(--mu);margin:14px 0}
.stories{display:flex;gap:12px;overflow-x:auto;padding:4px 0 14px}.st{flex:0 0 auto;width:68px;text-align:center;font-size:11px;color:var(--mu);cursor:pointer}
.st i{display:block;width:64px;height:64px;border-radius:50%;padding:3px;background:conic-gradient(var(--a),var(--b),var(--c),var(--a));margin-bottom:4px}.st b{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--p2) center/cover;border:2px solid var(--bg);font-size:22px}
.bot{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:#120c24ee;backdrop-filter:blur(12px);border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
.bot button{background:none;display:grid;justify-items:center;font-size:11px;color:var(--mu);padding:4px 10px}.bot button span{font-size:20px}.bot button.on{color:var(--tx)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}.chips button{white-space:nowrap}.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.kp div{background:var(--p2);border-radius:14px;padding:12px}.kp b{font-size:22px;display:block}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:700;max-width:92vw;z-index:30}
#md{position:fixed;inset:0;background:#000c;z-index:20;display:flex;align-items:flex-end;justify-content:center}#md .box{width:min(600px,100%);max-height:88vh;overflow:auto;margin:0}
video,audio,img.m{width:100%;border-radius:12px;margin:8px 0}.auth{max-width:440px;margin:30px auto}
.cover{min-height:100vh;display:grid;place-content:center;justify-items:center;text-align:center;gap:14px;padding:24px;background:radial-gradient(circle at 15% 10%,#7c5cff66,transparent 40%),radial-gradient(circle at 90% 85%,#ff7a5966,transparent 45%)}
.cover h1{font-size:clamp(38px,9vw,64px);line-height:1.02;margin:0}.cover h2{margin:0;font-size:clamp(26px,6vw,38px)}.cover p{max-width:460px;color:var(--mu);margin:0}.cover .big{font-size:clamp(46px,12vw,80px)}.cover button{padding:14px 34px;font-size:17px;border-radius:30px}
.adv{display:grid;gap:10px;max-width:440px;width:100%}.adv div{background:#ffffff10;border:1px solid #ffffff22;border-radius:16px;padding:14px;text-align:left}.adv b{display:block}.adv span{color:var(--mu);font-size:13px}
.chipsgrid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:520px}.chipsgrid button{border-radius:30px;padding:10px 16px}
.card{border-radius:20px;background:#150f2a}.tt{padding:2px 14px 10px}.tt b{font-size:17px;line-height:1.3;display:block}.tt p{margin:4px 0 0;color:#d9d0f0;font-size:14px}.ht{font-style:normal;color:#9d8cff}.cv{position:relative;aspect-ratio:4/5}
.acts{display:flex;align-items:center;gap:4px;padding:6px 8px 0}.acts .mu{font-size:14px;color:var(--tx)}.ib{background:none!important;border:0!important;padding:6px 8px!important;display:inline-flex;align-items:center;gap:6px;color:var(--tx);border-radius:50%}.ib.on{color:#ff4d79}.ib.on svg{fill:#ff4d79}
.gs{grid-area:1/1;justify-self:end;align-self:end;margin:12px;z-index:3;width:52px;height:52px;border-radius:50%!important;padding:0!important;display:grid;place-items:center;background:#1a1430cc!important;border:1px solid #ffffff44!important;backdrop-filter:blur(6px);animation:flt 2.6s ease-in-out infinite;box-shadow:0 0 18px #7c5cffaa}@keyframes flt{50%{transform:translateY(-8px)}}.vf{vertical-align:-3px;margin-left:4px}
.bot button svg{width:24px;height:24px}#md{align-items:flex-start}#md .box{height:100vh;max-height:100vh;border-radius:0;border:0;width:min(640px,100%)}@media(prefers-reduced-motion:reduce){.gs{animation:none}}
</style></head><body><div class="w" id="root"></div>
