
name: ZAMBA Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - zamba-mobile-fixes

permissions:
  contents: read

concurrency:
  group: zamba-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build ZAMBA APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate project files
        run: |
          test -f zamba-app.html
          test -f capacitor.config.json
          test -f file_000000007ed48208aac7a9cb25df704a.png
          echo "ZAMBA project files verified."

      - name: Build web application
        run: npm run build:web

      - name: Ensure Android platform
        run: |
          if [ ! -d android ]; then
            echo "Creating Android platform..."
            npx cap add android
          fi

          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            echo "ERROR: Android platform is incomplete."
            exit 1
          fi

          echo "Android platform verified."

      - name: Generate official ZAMBA icon
        run: |
          mkdir -p assets
          cp file_000000007ed48208aac7a9cb25df704a.png assets/icon.png
          npm install --no-save @capacitor/assets
          
      - name: Generate official ZAMBA icon
        run: |
          mkdir -p assets
          cp file_000000007ed48208aac7a9cb25df704a.png assets/icon.png
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000' --logoSplashScale 0.16

      - name: Synchronize Android
        run: npx cap sync android

      - name: Configure Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")

          permissions = [
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
          ]

          for permission in permissions:
              pattern = rf'<uses-permission\s+android:name="{re.escape(permission)}"\s*/?>'
              if not re.search(pattern, content):
                  content = re.sub(
                      r'(<manifest\b[^>]*>)',
                      r'\1\n    <uses-permission android:name="' + permission + '" />',
                      content,
                      count=1
                  )

          if not re.search(r'<application\b', content):
              raise SystemExit("ERROR: Android application element missing.")

          manifest.write_text(content, encoding="utf-8")
          print("Android permissions verified.")
          PY

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "ZAMBA APK successfully generated."

      - name: Upload ZAMBA APK
        uses: actions/upload-artifact@v4
        with:
          name: ZAMBA-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
