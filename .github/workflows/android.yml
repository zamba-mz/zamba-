
name: ZAMBA Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - zamba-android-preparation

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get ZAMBA source
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Prepare ZAMBA web files
        run: npm run build:web

      - name: Add Android platform
        run: npx cap add android

      - name: Install ZAMBA branding
        run: |
          unzip -o zamba-identidade-android.zip -d branding
          for folder in branding/zamba-identidade-android/android/app/src/main/res/mipmap-*; do
            cp "$folder"/ic_launcher*.png "android/app/src/main/res/$(basename "$folder")/"
          done

      - name: Synchronize Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save ZAMBA APK
        uses: actions/upload-artifact@v4
        with:
          name: ZAMBA-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
