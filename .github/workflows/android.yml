
name: ZAMBA Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - zamba-mobile-fixes

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get ZAMBA source
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Prepare ZAMBA web files
        run: npm run build:web

      - name: Add Android platform
        run: npx cap add android

      - name: Synchronize Android
        run: npx cap sync android
   
      - name: Configure Android camera and microphone permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")

          permissions = [
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
          ]

          for permission in permissions:
              if not re.search(
                  rf'<uses-permission\s+android:name="{re.escape(permission)}"\s*/?>',
                  content
              ):
                  content = re.sub(
                      r'(<manifest\b[^>]*>)',
                      r'\1\n    <uses-permission android:name="' + permission + '" />',
                      content,
                      count=1
                  )

          if not re.search(r'<application\b', content):
              raise SystemExit("Erro: elemento application não encontrado.")

          manifest.write_text(content, encoding="utf-8")
          print("Permissões da câmara e do microfone verificadas.")
          PY
       
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save ZAMBA APK
        uses: actions/upload-artifact@v4
        with:
          name: ZAMBA-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
